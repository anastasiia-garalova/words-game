<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple past</title>
    <link rel="stylesheet" href="style/style.css">

</head>
<body>

    <div class="modal1">

        <div class="form-content" id="login-form">


            <h2>Anmeldung</h2>
            <form action="/login" method="POST">
                <input type="text" id="login" name="login" required placeholder="Username">
                <input type="password" name="password" placeholder="Password" required>
                
                <button type="submit">Anmelden</button>
                
            </form>
            
            <button type="button" class="form-link" id="register-link">
                Registrieren
            </button>

        </div>
        <div class="form-content" style="display: none;" id="register-form">

            <h2>Registrieren</h2>
            <form action="/users/add" method="POST">
                <input type="text"  name="name" required placeholder="Username">
                <input type="email"  name="email" required placeholder="Email">
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Registrieren</button>
            </form>
            
            <button type="button" class="form-link" id="anmeldung-link">
                    Anmelden
            </button>
        </div>

        
    </div>

    <script src="script/auth-ui.js"></script>
</body>
</html>
